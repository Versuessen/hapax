# Every push to main becomes a signed release that installed copies of Hapax
# pick up on their next start (see src/lib/updates.js).
#
# Version: <major>.<minor> from src-tauri/tauri.conf.json + the workflow run
# number as patch, so each build is strictly newer than the last.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#   RELEASE_TOKEN                       fine-grained token: Contents + Workflows read/write
#                                       on this repository. The built-in GITHUB_TOKEN cannot
#                                       create a tag on a commit whose history changes
#                                       .github/workflows, so it cannot publish releases here.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions/setup-node@v5
        with: { node-version: lts/*, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  version:
    needs: test
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          base=$(node -p "require('./src-tauri/tauri.conf.json').version.split('.').slice(0,2).join('.')")
          v="$base.${{ github.run_number }}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check that the updater signing key is configured
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is not set. See docs/releasing.md → One-time setup, then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v5
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev rpm
      - uses: actions/setup-node@v5
        with: { node-version: lts/*, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: npm ci
      - run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}
      - name: Build and sign
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Sign any bundle the bundler left unsigned
        shell: bash
        run: |
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/{deb/*.deb,rpm/*.rpm,appimage/*.AppImage,nsis/*-setup.exe}; do
            [ -f "$f.sig" ] || npx tauri signer sign "$f"
          done
      - name: Collect
        shell: bash
        run: |
          mkdir dist-release
          shopt -s nullglob
          cp src-tauri/target/release/bundle/{deb/*.deb,rpm/*.rpm,appimage/*.AppImage,nsis/*-setup.exe}{,.sig} dist-release/ 2>/dev/null || true
          ls -la dist-release
      - uses: actions/upload-artifact@v6
        with:
          name: bundles-${{ runner.os }}
          path: dist-release/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v7
        with: { path: dist-release, merge-multiple: true }
      - name: Release notes from commits since the previous release
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          git log --no-merges --pretty='- %s' $range | head -60 > notes.md
          [ -s notes.md ] || echo "- Maintenance build" > notes.md
          cat notes.md
      - name: Updater manifest
        run: node scripts/make-latest-json.mjs ${{ needs.version.outputs.version }} ${{ needs.version.outputs.tag }} dist-release notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret RELEASE_TOKEN is not set. See docs/releasing.md → One-time setup, then re-run this job."
            exit 1
          fi
          gh release create ${{ needs.version.outputs.tag }} dist-release/* \
            --title "Hapax ${{ needs.version.outputs.version }}" \
            --notes-file notes.md \
            --target ${{ github.sha }} \
            --latest
